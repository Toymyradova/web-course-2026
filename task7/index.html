<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пастельная лента</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header class="app-header">
            <h1>Пастельная лента</h1>
            <p class="subtitle">Посты из космоса (jsonplaceholder)</p>
            
            <div class="search-wrapper">
                <input type="search" id="search" class="search-input" placeholder="Поиск по заголовку..." autocomplete="off">
            </div>
        </header>

        <div class="stats" id="stats"></div>

        <main class="posts" id="posts"></main>

        <div class="state hidden" id="loading">
            <div class="spinner"></div>
            <p>Загрузка…</p>
        </div>

        <div class="state error hidden" id="error"></div>

        <div class="state empty hidden" id="empty">
            <p>Постов не найдено</p>
        </div>

        <div class="state end hidden" id="end">
            <p>Больше постов нет</p>
        </div>
    </div>

    <button class="btn-up hidden" id="btn-up" title="Наверх">↑</button>

    <script src="model.js" defer></script>
    <script src="view.js" defer></script>
    <script src="controller.js" defer></script>
</body>
</html>
