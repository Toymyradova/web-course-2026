<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Мои задачи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📝 Мои задачи</h1>
        <p class="subtitle">✨ Список дел для учёбы и жизни ✨</p>
    </header>

    <main>
        <section class="input-area">
            <input type="text" id="task-input" placeholder="✏️ Введите новую задачу...">
            <button id="add-btn">➕ Добавить</button>
        </section>

        <section class="filters">
            <button class="filter-btn active" data-filter="all">📋 Все</button>
            <button class="filter-btn" data-filter="active">🔥 Активные</button>
            <button class="filter-btn" data-filter="completed">✅ Завершённые</button>
        </section>

        <p id="counter">📌 Осталось: 0 | 🎉 Выполнено: 0</p>

        <ul id="task-list"></ul>

        <div id="empty-state" class="empty-state">
            <div class="empty-emoji">📚✏️</div>
            <p>Пока нет задач. Добавьте первую!</p>
            <small>Совет: начните с чего-нибудь маленького 💖</small>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
