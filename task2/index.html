<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task2 — Landing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">Мой Бренд</div>
        <nav class="nav">
            <a href="#services">Услуги</a>
            <a href="#about">О нас</a>
            <a href="#contact">Контакты</a>
            <span class="burger">☰</span>
        </nav>
    </header>

    <section class="hero">
        <h1>Добро пожаловать!</h1>
        <p>Мы делаем крутые вещи для вас.</p>
        <button class="btn">Узнать больше</button>
    </section>

    <section class="services" id="services">
        <h2>Наши услуги</h2>
        <div class="cards">
            <div class="card">
                <h3>Услуга 1</h3>
                <p>Описание первой услуги.</p>
            </div>
            <div class="card">
                <h3>Услуга 2</h3>
                <p>Описание второй услуги.</p>
            </div>
            <div class="card">
                <h3>Услуга 3</h3>
                <p>Описание третьей услуги.</p>
            </div>
        </div>
    </section>

    <section class="contact" id="contact">
        <h2>Свяжитесь с нами</h2>
        <form class="form">
            <input type="text" placeholder="Ваше имя" required>
            <input type="email" placeholder="Ваш Email" required>
            <textarea placeholder="Ваше сообщение" required></textarea>
            <button type="submit" class="btn">Отправить</button>
        </form>
    </section>

    <footer class="footer">
        <p>© 2026 Мой Бренд. Все права защищены.</p>
    </footer>

</body>
</html>
